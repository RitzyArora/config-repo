
server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3306/bookdb
spring.datasource.username=root
spring.datasource.password=ritika20

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

#Circuit Breaker configuration
resilience4j.circuitbreaker.instances.categoryServiceBreaker.register-health-indicator=true

resilience4j.circuitbreaker.instances.categoryServiceBreaker.sliding-window-size=5

resilience4j.circuitbreaker.instances.categoryServiceBreaker.minimum-number-of-calls=3

resilience4j.circuitbreaker.instances.categoryServiceBreaker.failure-rate-threshold=50

resilience4j.circuitbreaker.instances.categoryServiceBreaker.wait-duration-in-open-state=10s

resilience4j.circuitbreaker.instances.categoryServiceBreaker.permitted-number-of-calls-in-half-open-state=2

resilience4j.circuitbreaker.instances.categoryServiceBreaker.automatic-transition-from-open-to-half-open-enabled=true

#bulkhead config
resilience4j.bulkhead.instances.categoryBulkhead.max-concurrent-calls=2
resilience4j.bulkhead.instances.categoryBulkhead.max-wait-duration=2s

